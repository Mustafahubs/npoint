services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - npoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis-protocol store used for rate limiting (Rack::Attack) and bandwidth
  # tracking. Production uses Valkey; plain Redis is a drop-in for local use.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - npoint_redisdata:/data

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Read by config/database.yml (host) and libpq/the pg gem directly
      # (user/password, which database.yml's development block leaves unset).
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      HOST: localhost
      # Only needed if you change the host-side port below (e.g. "8080:3001")
      # - set it to that host port so generated URLs (api_url, etc.) are
      # correct. Left unset here since it defaults to matching PORT.
      # PUBLIC_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  npoint_pgdata:
  npoint_redisdata:
